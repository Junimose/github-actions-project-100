name: Reusable Trivy Scan

on:
  workflow_call:

jobs:
  trivy-scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Installation
        uses: aquasecurity/trivy-action@0.24.0
        with:
          version: v0.61.0

      - name: Trivy FS Scan
        run: trivy fs --format table -o fs-report.json .
